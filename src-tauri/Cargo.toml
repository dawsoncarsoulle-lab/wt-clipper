[package]
name = "wt-clipper-tauri"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
walkdir = "2"
wt-clipper = { path = ".." }
